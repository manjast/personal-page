name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pages-production' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'build' || format('build ({0})', github.event_name) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Validate production Formspree configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_FORMSPREE_FORM_ID: ${{ secrets.PUBLIC_FORMSPREE_FORM_ID }}
        run: |
          if [ -z "$PUBLIC_FORMSPREE_FORM_ID" ]; then
            echo "Production Formspree configuration is unavailable." >&2
            exit 1
          fi

      - name: Build site
        env:
          PUBLIC_FORMSPREE_FORM_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PUBLIC_FORMSPREE_FORM_ID || 'ci-validation-placeholder' }}
        run: npm run build

      - name: Verify contact form configuration
        env:
          PUBLIC_FORMSPREE_FORM_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PUBLIC_FORMSPREE_FORM_ID || 'ci-validation-placeholder' }}
        run: |
          test -n "$PUBLIC_FORMSPREE_FORM_ID"
          grep -Fq "action=\"https://formspree.io/f/${PUBLIC_FORMSPREE_FORM_ID}\"" dist/contact/index.html
          grep -Fq 'name="_gotcha"' dist/contact/index.html
          grep -Fq "action=\"https://formspree.io/f/${PUBLIC_FORMSPREE_FORM_ID}\"" dist/sr/contact/index.html
          grep -Fq 'name="_gotcha"' dist/sr/contact/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check deployment freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment: this workflow SHA is no longer current main."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
